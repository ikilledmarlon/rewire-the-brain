<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Pathway Not Found · Rewire The Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100vh;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(232,146,42,0.15) 0%, transparent 40%),
    linear-gradient(180deg, #050816 0%, #02030c 50%, #000 100%);
  color: #ffffff;
  font-family: 'Oswald', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
}
.logo {
  width: 100px; height: 100px;
  background-image: url('tla_logo.png');
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  margin: 0 auto 32px;
  filter: drop-shadow(0 0 30px rgba(232,146,42,0.5));
  opacity: 0.6;
}
.code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #E8922A;
  letter-spacing: 6px;
  margin-bottom: 20px;
  font-weight: 700;
}
h1 {
  font-size: clamp(48px, 8vw, 96px);
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 0.95;
  text-transform: uppercase;
  margin-bottom: 16px;
}
h1 .a { color: #ffffff; display: block; }
h1 .b {
  background: linear-gradient(180deg, #FFB347 0%, #b86a18 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: block;
}
.line {
  font-size: 16px;
  color: #c0d4ff;
  font-weight: 300;
  max-width: 480px;
  margin: 0 auto 32px;
  line-height: 1.6;
}
.line strong { color: #FFB347; font-weight: 600; }
a {
  display: inline-block;
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  font-weight: 600;
  background: linear-gradient(135deg, #FFB347 0%, #E8922A 50%, #b86a18 100%);
  color: #000;
  padding: 16px 36px;
  text-decoration: none;
  letter-spacing: 3px;
  text-transform: uppercase;
  box-shadow: 0 0 0 2px rgba(232,146,42,0.4), 0 0 60px rgba(232,146,42,0.4), 0 10px 30px rgba(0,0,0,0.5);
  transition: all 0.2s;
}
a:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 0 2px rgba(232,146,42,0.6), 0 0 80px rgba(232,146,42,0.6);
}
</style>
</head>
<body>
<div>
  <div class="logo"></div>
  <div class="code">▸ ERROR 404 ▸</div>
  <h1>
    <span class="a">Pathway</span>
    <span class="b">Not Wired</span>
  </h1>
  <p class="line">
    The route you tried doesn't exist yet. <strong>Use it or lose it.</strong>
  </p>
  <a href="/">▶ BACK TO THE STAGE</a>
</div>
</body>
</html>
